<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Executive Operations Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: -apple-system, sans-serif; }
        .card { background: #0f172a; border-radius: 18px; padding: 1rem; margin-bottom: 0.75rem; border: 1px solid #1e293b; }
        .btn-action { background: #2563eb; transition: all 0.1s; }
        .btn-action:active { transform: scale(0.96); }
        input, select { background: #1e293b !important; color: white !important; border: none !important; outline: none !important; }
        .checkbox-custom { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #334155; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .checked { background: #2563eb; border-color: #2563eb; }
    </style>
</head>
<body class="p-4 pb-24">

    <header class="flex justify-between items-center mb-5">
        <div>
            <h1 class="text-xl font-bold tracking-tight text-white">Daily Operations</h1>
            <p id="dateHeader" class="text-blue-400 text-[10px] font-bold uppercase tracking-widest"></p>
        </div>
        <button onclick="resetEverything()" class="text-slate-600 text-[10px] uppercase font-bold">Reset Day ⚠️</button>
    </header>

    <section class="card">
        <h2 class="text-slate-400 text-[10px] font-bold uppercase mb-3 tracking-widest text-center">📝 Discipline Checklist</h2>
        <div class="space-y-3">
            <div class="flex items-center gap-3" onclick="toggleTask(0)">
                <div id="check-0" class="checkbox-custom"></div>
                <span class="text-sm">📚 Grade 12 Study Block 1</span>
            </div>
            <div class="flex items-center gap-3" onclick="toggleTask(1)">
                <div id="check-1" class="checkbox-custom"></div>
                <span class="text-sm">📖 Grade 12 Study Block 2</span>
            </div>
            <div class="flex items-center gap-3" onclick="toggleTask(2)">
                <div id="check-2" class="checkbox-custom"></div>
                <span class="text-sm">💪 Calisthenics Session</span>
            </div>
        </div>
    </section>

    <section class="card">
        <h2 class="text-emerald-400 text-[10px] font-bold uppercase mb-3 tracking-widest text-center">🍲 Fuel & Bulk</h2>
        <div class="grid grid-cols-4 gap-2 mb-4">
            <button onclick="addFuel(25, 5, 0)" class="bg-slate-800 p-2 rounded-lg text-[9px] font-bold">🥤 USN</button>
            <button onclick="addFuel(6, 1, 0)" class="bg-slate-800 p-2 rounded-lg text-[9px] font-bold">🥚 EGG</button>
            <button onclick="addFuel(4, 40, 250)" class="bg-slate-800 p-2 rounded-lg text-[9px] font-bold text-orange-400">🍶 THOBWA</button>
            <button onclick="addFuel(0, 0, 500)" class="bg-blue-600 p-2 rounded-lg text-[9px] font-bold">💧 H2O</button>
        </div>
        <div class="grid grid-cols-3 gap-2 mb-4">
            <input type="number" id="customP" placeholder="Prot (g)" class="rounded-lg p-2 text-xs text-center">
            <input type="number" id="customC" placeholder="Carb (g)" class="rounded-lg p-2 text-xs text-center">
            <button onclick="addCustomMeal()" class="bg-emerald-600/20 text-emerald-400 p-2 rounded-lg text-[9px] font-bold border border-emerald-500/20">➕ ADD MEAL</button>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center">
            <div><p class="text-[9px] text-slate-500 uppercase">Protein</p><p class="text-lg font-bold text-emerald-400"><span id="pDisp">0</span>g</p></div>
            <div><p class="text-[9px] text-slate-500 uppercase">Carbs</p><p class="text-lg font-bold text-orange-400"><span id="cDisp">0</span>g</p></div>
            <div><p class="text-[9px] text-slate-500 uppercase">Water</p><p id="wStatus" class="text-lg font-bold"><span id="wDisp">0</span>L</p></div>
        </div>
    </section>

    <section class="card">
        <h2 class="text-blue-400 text-[10px] font-bold uppercase mb-3 tracking-widest text-center">📈 ICT Trading Log</h2>
        <div class="grid grid-cols-2 gap-2 mb-3">
            <input type="text" id="pair" placeholder="Pair" class="rounded-lg p-3 text-xs">
            <input type="number" id="rr" placeholder="RR" class="rounded-lg p-3 text-xs">
        </div>
        <select id="result" class="w-full rounded-lg p-3 text-xs mb-2">
            <option value="WIN">✅ WIN</option>
            <option value="LOSS">❌ LOSS</option>
            <option value="BE">⚖️ BREAKEVEN</option>
        </select>
        <button onclick="logTrade()" class="w-full btn-action py-3 rounded-xl font-bold text-sm shadow-lg shadow-blue-500/10">RECORD TRADE</button>
        <div id="tradeLog" class="mt-4 space-y-2 max-h-40 overflow-y-auto"></div>
    </section>

    <section class="card bg-slate-900/50 border-blue-500/10">
        <h2 class="text-slate-400 text-[10px] font-bold uppercase mb-3 tracking-widest text-center">📊 Summary & Analytics</h2>
        
        <div class="space-y-2 text-[10px]">
            <div class="flex justify-between p-2 bg-slate-800/50 rounded">
                <span class="text-slate-500">All-Time Win Rate:</span>
                <span id="allTimeWin" class="text-white font-bold">0%</span>
            </div>
            <div class="flex justify-between p-2 bg-slate-800/50 rounded">
                <span class="text-slate-500">Lifetime Protein:</span>
                <span id="lifetimeP" class="text-emerald-400 font-bold">0g</span>
            </div>
            <div class="flex justify-between p-2 bg-slate-800/50 rounded">
                <span class="text-slate-500">Monthly Bulk Consistency:</span>
                <span id="consistency" class="text-white font-bold">0/30</span>
            </div>
        </div>
    </section>

    <script>
        let store = JSON.parse(localStorage.getItem('opsData')) || {
            daily: { p: 0, c: 0, w: 0, tasks: [false, false, false], date: new Date().toLocaleDateString() },
            trades: [],
            history: []
        };

        function init() {
            const today = new Date().toLocaleDateString();
            if (store.daily.date !== today) {
                store.history.push({...store.daily});
                store.daily = { p: 0, c: 0, w: 0, tasks: [false, false, false], date: today };
            }
            document.getElementById('dateHeader').innerText = today;
            updateUI();
        }

        function toggleTask(idx) {
            store.daily.tasks[idx] = !store.daily.tasks[idx];
            updateUI();
        }

        function addFuel(p, c, w) {
            store.daily.p += p;
            store.daily.c += c;
            store.daily.w += w;
            updateUI();
        }

        function addCustomMeal() {
            const p = parseInt(document.getElementById('customP').value) || 0;
            const c = parseInt(document.getElementById('customC').value) || 0;
            if(p > 0 || c > 0) { addFuel(p, c, 0); document.getElementById('customP').value = ''; document.getElementById('customC').value = ''; }
        }

        function logTrade() {
            const p = document.getElementById('pair').value;
            const r = document.getElementById('rr').value;
            const res = document.getElementById('result').value;
            if(!p || !r) return;
            store.trades.unshift({ p, r, res, d: new Date().toLocaleDateString() });
            document.getElementById('pair').value = '';
            document.getElementById('rr').value = '';
            updateUI();
        }

        function updateUI() {
            localStorage.setItem('opsData', JSON.stringify(store));
            
            // Counters
            document.getElementById('pDisp').innerText = store.daily.p;
            document.getElementById('cDisp').innerText = store.daily.c;
            document.getElementById('wDisp').innerText = (store.daily.w / 1000).toFixed(1);
            document.getElementById('wStatus').className = store.daily.w < 3000 ? "text-lg font-bold text-red-500" : "text-lg font-bold text-blue-400";
            
            // Checklist
            store.daily.tasks.forEach((t, i) => {
                document.getElementById(`check-${i}`).className = t ? "checkbox-custom checked" : "checkbox-custom";
                document.getElementById(`check-${i}`).innerHTML = t ? "✓" : "";
            });

            // Trades Log
            const log = document.getElementById('tradeLog');
            log.innerHTML = store.trades.map(t => `
                <div class="flex justify-between bg-slate-900 p-2 rounded text-[10px] border-l-2 ${t.res.includes('WIN') ? 'border-emerald-500' : (t.res.includes('LOSS') ? 'border-red-500' : 'border-slate-500')}">
                    <span>${t.p} (${t.r}R)</span>
                    <span class="font-bold">${t.res}</span>
                </div>
            `).join('');

            // ALL TIME & ANALYTICS
            const totalTrades = store.trades.length;
            const wins = store.trades.filter(t => t.res.includes('WIN')).length;
            const lifeP = store.history.reduce((acc, d) => acc + d.p, 0) + store.daily.p;
            
            document.getElementById('allTimeWin').innerText = totalTrades > 0 ? Math.round((wins/totalTrades)*100) + "%" : "0%";
            document.getElementById('lifetimeP').innerText = (lifeP / 1000).toFixed(2) + "kg";
            document.getElementById('consistency').innerText = store.history.filter(d => d.p >= 150).length + "/30";
        }

        function resetEverything() { if(confirm("Reset today?")) { store.daily = { p: 0, c: 0, w: 0, tasks: [false, false, false], date: new Date().toLocaleDateString() }; updateUI(); } }

        init();
    </script>
</body>
</html>
