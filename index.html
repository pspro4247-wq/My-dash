<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Executive Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: -apple-system, system-ui, sans-serif; }
        .card { background: #0f172a; border-radius: 20px; padding: 1.25rem; margin-bottom: 1rem; border: 1px solid #1e293b; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .btn-action { background: #2563eb; transition: transform 0.1s; }
        .btn-action:active { transform: scale(0.95); }
        input[type="checkbox"] { width: 1.2rem; height: 1.2rem; border-radius: 4px; accent-color: #3b82f6; }
    </style>
</head>
<body class="p-4 pb-24">

    <header class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Daily Operations</h1>
            <p class="text-slate-400 text-xs uppercase tracking-widest font-semibold">Bulk • Trade • Study</p>
        </div>
        <div class="bg-blue-500/10 p-2 rounded-full border border-blue-500/20">
            <span class="text-blue-400 text-xs font-bold">LIVE</span>
        </div>
    </header>

    <section class="card">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-blue-400 font-bold flex items-center gap-2">
                <span>📈</span> Trading Log
            </h2>
            <span class="text-[10px] bg-slate-800 px-2 py-1 rounded text-slate-400">ICT STRATEGY</span>
        </div>
        <div class="space-y-3">
            <input type="text" id="pair" placeholder="Pair (e.g. EURUSD)" class="w-full bg-slate-800 border-none rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500">
            <div class="grid grid-cols-2 gap-2">
                <input type="number" id="rr" placeholder="RR Ratio" class="bg-slate-800 border-none rounded-lg p-3 text-sm">
                <select id="result" class="bg-slate-800 border-none rounded-lg p-3 text-sm">
                    <option value="WIN">WIN</option>
                    <option value="LOSS">LOSS</option>
                    <option value="BE">B.EVEN</option>
                </select>
            </div>
            <button onclick="logTrade()" class="w-full btn-action py-3 rounded-xl font-bold shadow-lg shadow-blue-500/20">Record Entry</button>
        </div>
        <div id="tradeHistory" class="mt-4 space-y-2 text-xs"></div>
    </section>

    <section class="card">
        <h2 class="text-emerald-400 font-bold mb-4 flex items-center gap-2">
            <span>💪</span> Bulk Tracker (+10kg Goal)
        </h2>
        <div class="grid grid-cols-3 gap-2 mb-4">
            <button onclick="addProtein(25)" class="bg-slate-800 p-2 rounded-lg text-[10px] border border-slate-700 font-medium">USN SCOOP</button>
            <button onclick="addProtein(6)" class="bg-slate-800 p-2 rounded-lg text-[10px] border border-slate-700 font-medium">1 EGG</button>
            <button onclick="addProtein(5)" class="bg-slate-800 p-2 rounded-lg text-[10px] border border-slate-700 font-medium">THOBWA</button>
        </div>
        <div class="text-center p-4 bg-emerald-500/5 rounded-2xl border border-emerald-500/10">
            <p class="text-slate-400 text-xs mb-1">Total Protein Today</p>
            <div class="text-3xl font-black text-emerald-400"><span id="pDisplay">0</span><span class="text-sm text-slate-500">g</span></div>
        </div>
    </section>

    <section class="card">
        <h2 class="text-orange-400 font-bold mb-4 flex items-center gap-2">
            <span>⚡</span> Priority Tasks
        </h2>
        <div class="space-y-4">
            <label class="flex items-center gap-3">
                <input type="checkbox"> <span class="text-sm text-slate-300">Grade 12 Revision (Deep Work)</span>
            </label>
            <label class="flex items-center gap-3">
                <input type="checkbox"> <span class="text-sm text-slate-300">Calisthenics (To Failure)</span>
            </label>
            <label class="flex items-center gap-3">
                <input type="checkbox"> <span class="text-sm text-slate-300">Market Analysis (London/NY)</span>
            </label>
        </div>
    </section>

    <script>
        let protein = parseInt(localStorage.getItem('pDaily')) || 0;
        document.getElementById('pDisplay').innerText = protein;

        function addProtein(amt) {
            protein += amt;
            document.getElementById('pDisplay').innerText = protein;
            localStorage.setItem('pDaily', protein);
        }

        function logTrade() {
            const p = document.getElementById('pair').value;
            const r = document.getElementById('rr').value;
            const res = document.getElementById('result').value;
            if(!p || !r) return;
            
            const entry = document.createElement('div');
            entry.className = "flex justify-between p-2 bg-slate-900 rounded border-l-2 " + (res === 'WIN' ? 'border-emerald-500' : 'border-red-500');
            entry.innerHTML = `<span>${p} [${r}RR]</span> <span class="${res === 'WIN' ? 'text-emerald-400' : 'text-red-400'} font-bold">${res}</span>`;
            document.getElementById('tradeHistory').prepend(entry);
        }
    </script>
</body>
</html>
